<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Workspace | GetPerfectResume</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body, html, .protected-zone { user-select: none !important; -webkit-user-select: none !important; -moz-user-select: none !important; -ms-user-select: none !important; }
        .watermark-overlay { position: relative; }
        .watermark-overlay::before {
            content: "PREVIEW LOCKED • UNLOCK VIA DOWNLOAD • PREVIEW LOCKED • UNLOCK VIA DOWNLOAD • ";
            position: absolute; top: 0; left: 0; width: 200%; height: 200%;
            font-size: 22px; font-weight: 900; color: rgba(15, 59, 104, 0.035);
            transform: rotate(-15deg); pointer-events: none; z-index: 50; display: block; padding: 40px; overflow: hidden;
        }
        .preview-font { font-family: 'Calibri', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 font-sans protected-zone flex flex-col min-h-screen">

    <nav class="bg-[#0F3B68] text-white px-4 md:px-6 py-3 flex flex-wrap justify-between items-center shadow-md shrink-0 gap-3">
        <div class="flex items-center space-x-3">
            <img src="/logo.png" alt="Logo" class="h-8 object-contain bg-white rounded p-0.5" onerror="this.style.display='none'">
            <span class="font-bold text-lg md:text-xl tracking-wide hidden sm:inline-block">GetPerfectResume<span class="text-blue-400">.com</span></span>
            <span class="bg-blue-900 text-[10px] px-2 py-0.5 rounded text-blue-300 font-mono hidden md:inline-block">Workspace v1.5</span>
        </div>
        <div class="flex items-center space-x-2 text-[10px] md:text-xs text-blue-200">
            <svg id="save-icon" class="w-3 h-3 md:w-4 md:h-4 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            <span id="save-text">All changes saved to cloud</span>
        </div>
        <div class="flex items-center space-x-4 md:space-x-6">
            <div class="bg-blue-950 px-3 md:px-4 py-1.5 rounded-full text-xs md:text-sm font-semibold flex items-center space-x-2 border border-blue-800">
                <span class="inline-block w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
                <span>Credits: <span id="credit-count" class="text-yellow-400">2</span></span>
            </div>
            <button onclick="logout()" class="text-xs md:text-sm text-gray-300 hover:text-white transition">Sign Out</button>
        </div>
    </nav>

    <div class="max-w-[1400px] w-full mx-auto px-2 md:px-4 py-4 md:py-6 grid grid-cols-1 lg:grid-cols-12 gap-4 md:gap-8 flex-grow">
        <div class="lg:col-span-4 bg-white rounded-xl shadow-sm border border-gray-200 p-4 md:p-5 space-y-5 max-h-[82vh] overflow-y-auto">
            <div>
                <h2 class="text-base md:text-lg font-bold text-gray-900">Live Editor</h2>
                <p class="text-[10px] md:text-xs text-gray-500">Edit your parsed data below. The framework syncs instantly.</p>
            </div>
            <div class="bg-blue-50 border border-blue-100 rounded-lg p-3 space-y-2">
                <label class="block text-[10px] font-bold text-[#0F3B68] uppercase tracking-wider flex justify-between items-center">
                    <span>Target Job Alignment</span>
                    <button onclick="triggerAI('jd')" class="text-blue-500 hover:text-blue-700 flex items-center gap-1 transition"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg> Optimize</button>
                </label>
                <textarea id="new-jd-input" rows="2" class="w-full text-xs p-2 border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-[#0F3B68]" placeholder="Paste target job description here..."></textarea>
                <button onclick="spendCreditToTailor()" class="w-full bg-[#0F3B68] text-white font-bold py-1.5 px-3 rounded text-xs hover:bg-blue-800 transition shadow-sm">Re-Tailor Resume (-1 Credit)</button>
            </div>
            <div class="space-y-4">
                <label class="block text-[10px] font-bold text-gray-700 mb-1 uppercase tracking-wider">Full Name</label><input type="text" id="edit-name" class="w-full text-xs p-2 border border-gray-300 rounded">
                <label class="block text-[10px] font-bold text-gray-700 mb-1 uppercase tracking-wider">Target Profile Title</label><input type="text" id="edit-title" class="w-full text-xs p-2 border border-gray-300 rounded">
                <label class="block text-[10px] font-bold text-gray-700 mb-1 uppercase tracking-wider">Contact Info</label><input type="text" id="edit-contact" class="w-full text-xs p-2 border border-gray-300 rounded">
                <label class="block text-[10px] font-bold text-gray-700 mb-1 uppercase tracking-wider">Summary</label><textarea id="edit-summary" rows="4" class="w-full text-xs p-2 border border-gray-300 rounded"></textarea>
                <label class="block text-[10px] font-bold text-gray-700 mb-1 uppercase tracking-wider">Skills</label><textarea id="edit-skills" rows="3" class="w-full text-xs p-2 border border-gray-300 rounded"></textarea>
                <label class="block text-[10px] font-bold text-gray-700 mb-1 uppercase tracking-wider">Achievements</label><textarea id="edit-achievements" rows="3" class="w-full text-xs p-2 border border-gray-300 rounded"></textarea>
                <label class="block text-[10px] font-bold text-gray-700 mb-1 uppercase tracking-wider">Employment</label><textarea id="edit-experience" rows="6" class="w-full text-xs p-2 border border-gray-300 rounded"></textarea>
                <label class="block text-[10px] font-bold text-gray-700 mb-1 uppercase tracking-wider">Education</label><textarea id="edit-education" rows="2" class="w-full text-xs p-2 border border-gray-300 rounded"></textarea>
                <label class="block text-[10px] font-bold text-gray-700 mb-1 uppercase tracking-wider">Certifications</label><textarea id="edit-certifications" rows="2" class="w-full text-xs p-2 border border-gray-300 rounded"></textarea>
                <label class="block text-[10px] font-bold text-gray-700 mb-1 uppercase tracking-wider">Personal</label><textarea id="edit-personal" rows="2" class="w-full text-xs p-2 border border-gray-300 rounded"></textarea>
            </div>
        </div>

        <div class="lg:col-span-8 flex flex-col space-y-4">
            <div class="flex flex-col xl:flex-row justify-between items-center bg-white p-3 md:p-4 rounded-xl shadow-sm border border-gray-200 gap-4">
                <div class="flex items-center gap-4"><div class="relative w-12 h-12"><svg class="w-full h-full" viewBox="0 0 36 36"><path class="text-gray-200" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-width="3" /><path id="score-ring" class="text-green-500" stroke-dasharray="88, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" /></svg><div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-[10px] font-bold">88%</div></div><div><p class="text-[10px] font-bold text-gray-500 uppercase">ATS Match</p><p class="text-xs font-semibold text-gray-800">Strong Verbs</p></div></div>
                <div class="flex bg-gray-100 p-1 rounded-lg overflow-x-auto"><button id="btn-sentinel" onclick="switchPreviewTemplate('sentinel')" class="px-3 py-1.5 text-xs font-bold rounded-md bg-white text-[#0F3B68] shadow-sm">Sentinel</button><button id="btn-vanguard" onclick="switchPreviewTemplate('vanguard')" class="px-3 py-1.5 text-xs font-bold rounded-md text-gray-600">Vanguard</button><button id="btn-creative" onclick="switchPreviewTemplate('creative')" class="px-3 py-1.5 text-xs font-bold rounded-md text-gray-600">Creative</button><button id="btn-global" onclick="switchPreviewTemplate('global')" class="px-3 py-1.5 text-xs font-bold rounded-md text-gray-600">Global</button></div>
                <button onclick="triggerPurchasePaywall()" class="bg-green-600 text-white font-bold text-sm px-5 py-2.5 rounded-lg">Download .docx</button>
            </div>
            <div class="bg-white rounded-xl shadow-md border border-gray-300 p-10 min-h-[70vh] max-h-[75vh] overflow-y-auto watermark-overlay relative preview-font" id="preview-frame">
                <div id="workspace-canvas" class="space-y-4 text-xs text-gray-800 relative z-10"></div>
            </div>
        </div>
    </div>

    <footer class="bg-gray-100 text-center py-4 text-[10px] text-gray-400 font-semibold border-t mt-auto">&copy; 2026 ORBIT CAREERS | SECURE WORKSPACE</footer>

    <script>
        const supabase = supabase.createClient('https://vkiitostqcjkiyflcjhu.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZraWl0b3N0cWNqa2l5Zmxjamh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3MTgyNDEsImV4cCI6MjA5NTI5NDI0MX0.a1vvLGJPEJ9l7v3HgHQQ4dIRs8HLN8IEPuGqnm-lHC4');

        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            fetch('/api/auth', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ email: session.user.email }) });
            renderCurrentCanvas();
        });

        // ... (Include your existing activeProfile, triggerAI, switchPreviewTemplate, renderCurrentCanvas, anti-theft, and new triggerPurchasePaywall/processPayment logic here) ...

</body>
</html>
