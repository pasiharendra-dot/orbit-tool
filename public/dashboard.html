<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Workspace | GetPerfectResume</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* DISALLOW HIGHLIGHTING & SELECTION */
        body, html, .protected-zone {
            user-select: none !important;
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
        }

        /* DIAGONAL PREVIEW WATERMARK BACKGROUND */
        .watermark-overlay {
            position: relative;
        }
        .watermark-overlay::before {
            content: "PREVIEW LOCKED • UNLOCK VIA DOWNLOAD • PREVIEW LOCKED • UNLOCK VIA DOWNLOAD • ";
            position: absolute;
            top: 0; left: 0; width: 200%; height: 200%;
            font-size: 22px;
            font-weight: 900;
            color: rgba(15, 59, 104, 0.035); /* Elegant ultra-faint brand text grid */
            transform: rotate(-15deg);
            pointer-events: none;
            z-index: 50;
            display: block;
            padding: 40px;
            overflow: hidden;
        }
        
        /* Layout Tuning for Previews */
        .preview-font { font-family: 'Calibri', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 font-sans protected-zone flex flex-col min-h-screen">

    <!-- Top Navigation Bar -->
    <nav class="bg-[#0F3B68] text-white px-6 py-3 flex justify-between items-center shadow-md shrink-0">
        <div class="flex items-center space-x-3">
            <!-- LOGO ADDED HERE -->
            <img src="/logo.png" alt="Logo" class="h-8 object-contain bg-white rounded p-0.5" onerror="this.style.display='none'">
            <span class="font-bold text-xl tracking-wide hidden sm:inline-block">GetPerfectResume<span class="text-blue-400">.com</span></span>
            <span class="bg-blue-900 text-xs px-2 py-0.5 rounded text-blue-300 font-mono ml-2">Workspace v1.3</span>
        </div>
        <div class="flex items-center space-x-6">
            <div class="bg-blue-950 px-4 py-1.5 rounded-full text-sm font-semibold flex items-center space-x-2 border border-blue-800">
                <span class="inline-block w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
                <span>Tailor Credits: <span id="credit-count" class="text-yellow-400">2</span></span>
            </div>
            <button onclick="logout()" class="text-sm text-gray-300 hover:text-white transition">Sign Out</button>
        </div>
    </nav>

    <!-- Main Workspace Layout -->
    <div class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-8 flex-grow">
        
        <!-- LEFT PANEL: Dynamic Control & Optimization Form -->
        <div class="lg:col-span-4 bg-white rounded-xl shadow-sm border border-gray-200 p-5 space-y-6 max-h-[82vh] overflow-y-auto">
            <div>
                <h2 class="text-lg font-bold text-gray-900">Live Editor</h2>
                <p class="text-xs text-gray-500">Edit your parsed data below. The framework syncs instantly.</p>
            </div>
            
            <div class="bg-blue-50 border border-blue-100 rounded-lg p-3 space-y-2">
                <label class="block text-[10px] font-bold text-[#0F3B68] uppercase tracking-wider">AI Keyword Sync</label>
                <textarea id="new-jd-input" rows="2" class="w-full text-xs p-2 border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-[#0F3B68]" placeholder="Paste target job description here..."></textarea>
                <button onclick="spendCreditToTailor()" class="w-full bg-[#0F3B68] text-white font-bold py-1.5 px-3 rounded text-xs hover:bg-blue-800 transition shadow-sm">
                    Re-Tailor Resume (-1 Credit)
                </button>
            </div>

            <!-- Full Interactive Editing Fields -->
            <div class="space-y-4">
                <div>
                    <label class="block text-[10px] font-bold text-gray-700 mb-1 uppercase tracking-wider">Full Name</label>
                    <input type="text" id="edit-name" class="w-full text-xs p-2 border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-[#0F3B68]">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-700 mb-1 uppercase tracking-wider">Target Profile Title</label>
                    <input type="text" id="edit-title" class="w-full text-xs p-2 border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-[#0F3B68]">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-700 mb-1 uppercase tracking-wider">Contact Info (Phone | Email | Location)</label>
                    <input type="text" id="edit-contact" class="w-full text-xs p-2 border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-[#0F3B68]">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-700 mb-1 uppercase tracking-wider">Professional Summary</label>
                    <textarea id="edit-summary" rows="4" class="w-full text-xs p-2 border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-[#0F3B68]"></textarea>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-700 mb-1 uppercase tracking-wider">Skills & Competencies (One per line)</label>
                    <textarea id="edit-skills" rows="3" class="w-full text-xs p-2 border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-[#0F3B68]"></textarea>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-700 mb-1 uppercase tracking-wider">Achievements & Awards (One per line)</label>
                    <textarea id="edit-achievements" rows="3" class="w-full text-xs p-2 border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-[#0F3B68]"></textarea>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-700 mb-1 uppercase tracking-wider">Employment Details</label>
                    <textarea id="edit-experience" rows="5" class="w-full text-xs p-2 border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-[#0F3B68]"></textarea>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-700 mb-1 uppercase tracking-wider">Education</label>
                    <textarea id="edit-education" rows="2" class="w-full text-xs p-2 border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-[#0F3B68]"></textarea>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-700 mb-1 uppercase tracking-wider">Certifications (One per line)</label>
                    <textarea id="edit-certifications" rows="2" class="w-full text-xs p-2 border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-[#0F3B68]"></textarea>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-700 mb-1 uppercase tracking-wider">Personal Details (One per line)</label>
                    <textarea id="edit-personal" rows="2" class="w-full text-xs p-2 border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-[#0F3B68]"></textarea>
                </div>
            </div>
        </div>

        <!-- RIGHT PANEL: Protected Framework Live Viewer -->
        <div class="lg:col-span-8 flex flex-col space-y-4">
            
            <!-- Context Control Bar -->
            <div class="flex flex-col sm:flex-row justify-between items-center bg-white p-3 rounded-xl shadow-sm border border-gray-200 gap-4">
                <!-- Framework Picker Inside Dashboard -->
                <div class="flex bg-gray-100 p-1 rounded-lg border border-gray-200 w-full sm:w-auto">
                    <button id="btn-sentinel" onclick="switchPreviewTemplate('sentinel')" class="px-3 py-1.5 text-xs font-bold rounded-md bg-white text-[#0F3B68] shadow-sm transition">Sentinel (ATS)</button>
                    <button id="btn-vanguard" onclick="switchPreviewTemplate('vanguard')" class="px-3 py-1.5 text-xs font-bold rounded-md text-gray-600 hover:text-gray-900 transition">Vanguard</button>
                    <button id="btn-creative" onclick="switchPreviewTemplate('creative')" class="px-3 py-1.5 text-xs font-bold rounded-md text-gray-600 hover:text-gray-900 transition">Creative</button>
                    <button id="btn-global" onclick="switchPreviewTemplate('global')" class="px-3 py-1.5 text-xs font-bold rounded-md text-gray-600 hover:text-gray-900 transition">Global</button>
                </div>

                <button onclick="triggerPurchasePaywall()" class="w-full sm:w-auto bg-green-600 hover:bg-green-700 text-white font-bold text-sm px-5 py-2 rounded-lg shadow-sm transition flex items-center justify-center">
                    <span>Download Raw Word Copy (.docx)</span>
                </button>
            </div>

            <!-- The Protected Document View Container -->
            <div class="bg-white rounded-xl shadow-md border border-gray-300 p-10 min-h-[75vh] max-h-[75vh] overflow-y-auto watermark-overlay relative preview-font" id="preview-frame">
                
                <!-- DYNAMIC RENDER SLOT -->
                <div id="workspace-canvas" class="space-y-4 text-xs text-gray-800 relative z-10">
                    <!-- Framework layers render here automatically via Javascript -->
                </div>

            </div>
        </div>

    </div>

    <!-- Minimalist SaaS Footer -->
    <footer class="bg-gray-100 text-center py-4 text-[10px] text-gray-400 font-semibold tracking-wider shrink-0 border-t border-gray-200 mt-auto">
        &copy; 2026 ORBIT CAREERS | SECURE CANDIDATE WORKSPACE
    </footer>

    <!-- WORKSPACE FRAMEWORK CORE LOGIC -->
    <script>
        // Mock static profile data matrix
        let activeProfile = {
            name: "AMIT SAXENA",
            title: "DEPUTY GENERAL MANAGER | CHANNEL MANAGEMENT & P&L OVERSIGHT",
            summary: "Highly accomplished Executive with 27+ years of extensive experience driving strategic business development, market expansion, and channel management across diverse fast-paced consumer industries.",
            contact: "+91 ●●●●●-●●●●●  |  a****a0601@gmail.com  |  New Delhi, India",
            skills: ["Strategic Business Development", "Channel Management", "Key Account Management", "P&L Management", "Market Expansion", "Team Leadership"],
            achievements: [
                "Achieved highest growth award in compressor segment scaling regional sales margins by 34%.",
                "Appointed 8 new strategic channel distribution partners within 2 years, securing emerging dealers recognition."
            ],
            experience: "Deputy General Manager - Samvardhana Motherson\nMay 2025 – Present\n• Led complete sales operations for India market segments.\n• Managed 9 high-performing team members to achieve annual operating targets.\n\nRegional Sales Leader - Ingersoll Rand\nJun 2010 – Jan 2019\n• Handled the complete channel network appointment process.\n• Led entire sales of Air Compressor Division in East Region.",
            education: "Master of Business Administration (MBA) | University of Delhi (1998)",
            certifications: ["Advance Certification Program in Leadership | IIM Lucknow (2019)"],
            personal: ["Date of Birth: 6th January 1976", "Languages: English, Hindi"]
        };

        let currentActiveTemplate = 'sentinel';

        // Initialize dashboard inputs and canvas loop
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('edit-name').value = activeProfile.name;
            document.getElementById('edit-title').value = activeProfile.title;
            document.getElementById('edit-contact').value = activeProfile.contact;
            document.getElementById('edit-summary').value = activeProfile.summary;
            document.getElementById('edit-skills').value = activeProfile.skills.join('\n');
            document.getElementById('edit-achievements').value = activeProfile.achievements.join('\n');
            document.getElementById('edit-experience').value = activeProfile.experience;
            document.getElementById('edit-education').value = activeProfile.education;
            document.getElementById('edit-certifications').value = activeProfile.certifications.join('\n');
            document.getElementById('edit-personal').value = activeProfile.personal.join('\n');

            // Wire up instant keystroke rendering tracking
            const fields = ['name', 'title', 'contact', 'summary', 'experience', 'education'];
            const arrayFields = ['skills', 'achievements', 'certifications', 'personal'];

            fields.forEach(f => {
                document.getElementById(`edit-${f}`).addEventListener('input', (e) => { 
                    activeProfile[f] = f === 'name' || f === 'title' ? e.target.value.toUpperCase() : e.target.value; 
                    renderCurrentCanvas(); 
                });
            });

            arrayFields.forEach(f => {
                document.getElementById(`edit-${f}`).addEventListener('input', (e) => { 
                    activeProfile[f] = e.target.value.split('\n').filter(val => val.trim() !== ''); 
                    renderCurrentCanvas(); 
                });
            });

            renderCurrentCanvas();
        });

        // Template Switcher UI Handler
        function switchPreviewTemplate(templateId) {
            currentActiveTemplate = templateId;
            ['sentinel', 'vanguard', 'creative', 'global'].forEach(id => {
                const btn = document.getElementById(`btn-${id}`);
                if (id === templateId) {
                    btn.className = "px-3 py-1.5 text-xs font-bold rounded-md bg-white text-[#0F3B68] shadow-sm transition";
                } else {
                    btn.className = "px-3 py-1.5 text-xs font-bold rounded-md text-gray-600 hover:text-gray-900 transition";
                }
            });
            renderCurrentCanvas();
        }

        // Master Layout Render Router
        function renderCurrentCanvas() {
            const canvas = document.getElementById('workspace-canvas');
            
            // Format experience text block for HTML preview
            const expFormatted = activeProfile.experience.split('\n').map(line => {
                if(line.startsWith('•') || line.startsWith('-')) return `<li class="ml-4 list-disc">${line.substring(1).trim()}</li>`;
                if(line.trim() === '') return `<br>`;
                return `<p class="font-bold text-gray-800 mt-2">${line}</p>`;
            }).join('');

            if (currentActiveTemplate === 'sentinel') {
                canvas.innerHTML = `
                    <div class="text-center border-b pb-3 border-blue-200">
                        <h1 class="text-2xl font-bold text-[#0F3B68] tracking-tight">${activeProfile.name}</h1>
                        <p class="text-xs font-bold text-gray-600 uppercase mt-1 tracking-wide">${activeProfile.title}</p>
                        <p class="text-[10px] text-gray-500 mt-1">${activeProfile.contact}</p>
                    </div>
                    <div>
                        <h2 class="text-xs font-bold text-[#0F3B68] border-b border-gray-200 pb-0.5 uppercase tracking-wider mt-2">Professional Summary</h2>
                        <p class="text-gray-600 mt-1.5 leading-relaxed text-justify">${activeProfile.summary}</p>
                    </div>
                    ${activeProfile.achievements.length ? `<div>
                        <h2 class="text-xs font-bold text-[#0F3B68] border-b border-gray-200 pb-0.5 uppercase tracking-wider mt-3">Achievements & Awards</h2>
                        <ul class="list-disc pl-4 mt-1.5 space-y-1 text-gray-600">${activeProfile.achievements.map(ach => `<li>${ach}</li>`).join('')}</ul>
                    </div>` : ''}
                    ${activeProfile.skills.length ? `<div>
                        <h2 class="text-xs font-bold text-[#0F3B68] border-b border-gray-200 pb-0.5 uppercase tracking-wider mt-3">Professional Skills</h2>
                        <p class="text-gray-600 mt-1.5">${activeProfile.skills.join('  |  ')}</p>
                    </div>` : ''}
                    <div>
                        <h2 class="text-xs font-bold text-[#0F3B68] border-b border-gray-200 pb-0.5 uppercase tracking-wider mt-3">Work Experience</h2>
                        <div class="text-gray-600">${expFormatted}</div>
                    </div>
                    ${activeProfile.education ? `<div>
                        <h2 class="text-xs font-bold text-[#0F3B68] border-b border-gray-200 pb-0.5 uppercase tracking-wider mt-3">Education</h2>
                        <p class="text-gray-600 mt-1.5">${activeProfile.education}</p>
                    </div>` : ''}
                    ${activeProfile.certifications.length ? `<div>
                        <h2 class="text-xs font-bold text-[#0F3B68] border-b border-gray-200 pb-0.5 uppercase tracking-wider mt-3">Certifications</h2>
                        <ul class="list-disc pl-4 mt-1.5 space-y-1 text-gray-600">${activeProfile.certifications.map(c => `<li>${c}</li>`).join('')}</ul>
                    </div>` : ''}
                    ${activeProfile.personal.length ? `<div>
                        <h2 class="text-xs font-bold text-[#0F3B68] border-b border-gray-200 pb-0.5 uppercase tracking-wider mt-3">Personal Details</h2>
                        <ul class="mt-1.5 space-y-1 text-gray-600">${activeProfile.personal.map(p => `<li>${p}</li>`).join('')}</ul>
                    </div>` : ''}
                `;
            } 
            else if (currentActiveTemplate === 'vanguard') {
                canvas.innerHTML = `
                    <div class="grid grid-cols-12 gap-4">
                        <div class="col-span-4 bg-[#0F3B68] text-white p-4 rounded-lg space-y-4 min-h-[60vh]">
                            <div class="text-center text-[10px] text-blue-300 border border-blue-800 py-4 rounded">Placeholder Photo Area</div>
                            <div>
                                <h3 class="font-bold border-b border-blue-400 text-[11px] tracking-wider mb-1.5">CONTACT</h3>
                                <p class="text-[10px] space-y-1 opacity-90">${activeProfile.contact.replace(/ \| /g, '<br>')}</p>
                            </div>
                            ${activeProfile.skills.length ? `<div>
                                <h3 class="font-bold border-b border-blue-400 text-[11px] tracking-wider mb-1.5">SKILLS</h3>
                                <ul class="text-[10px] space-y-1 opacity-90">${activeProfile.skills.map(s => `<li>• ${s}</li>`).join('')}</ul>
                            </div>` : ''}
                            ${activeProfile.education ? `<div>
                                <h3 class="font-bold border-b border-blue-400 text-[11px] tracking-wider mb-1.5">EDUCATION</h3>
                                <p class="text-[10px] opacity-90">${activeProfile.education}</p>
                            </div>` : ''}
                            ${activeProfile.certifications.length ? `<div>
                                <h3 class="font-bold border-b border-blue-400 text-[11px] tracking-wider mb-1.5">CERTIFICATIONS</h3>
                                <ul class="text-[10px] space-y-1 opacity-90">${activeProfile.certifications.map(c => `<li>• ${c}</li>`).join('')}</ul>
                            </div>` : ''}
                            ${activeProfile.personal.length ? `<div>
                                <h3 class="font-bold border-b border-blue-400 text-[11px] tracking-wider mb-1.5">DETAILS</h3>
                                <ul class="text-[10px] space-y-1 opacity-90">${activeProfile.personal.map(p => `<li>${p}</li>`).join('')}</ul>
                            </div>` : ''}
                        </div>
                        <div class="col-span-8 p-2 space-y-3">
                            <div>
                                <h1 class="text-2xl font-bold text-[#0F3B68]">${activeProfile.name}</h1>
                                <p class="text-xs font-bold text-amber-600 mt-0.5 uppercase">${activeProfile.title}</p>
                            </div>
                            <div>
                                <h3 class="font-bold text-[#0F3B68] border-b border-gray-200 pb-0.5 uppercase text-[11px]">Professional Summary</h3>
                                <p class="text-gray-600 mt-1 leading-relaxed text-justify">${activeProfile.summary}</p>
                            </div>
                            ${activeProfile.achievements.length ? `<div>
                                <h3 class="font-bold text-[#0F3B68] border-b border-gray-200 pb-0.5 uppercase text-[11px] mt-2">Achievements</h3>
                                <ul class="list-disc pl-4 mt-1 text-gray-600 space-y-0.5">${activeProfile.achievements.map(ach => `<li>${ach}</li>`).join('')}</ul>
                            </div>` : ''}
                            <div>
                                <h3 class="font-bold text-[#0F3B68] border-b border-gray-200 pb-0.5 uppercase text-[11px] mt-2">Experience</h3>
                                <div class="text-gray-600">${expFormatted}</div>
                            </div>
                        </div>
                    </div>
                `;
            }
            else if (currentActiveTemplate === 'creative') {
                canvas.innerHTML = `
                    <div class="grid grid-cols-12 gap-6 border-b-2 border-[#1F4E79] pb-3 mb-3">
                        <div class="col-span-7">
                            <h1 class="text-2xl font-bold text-[#1F4E79]">${activeProfile.name}</h1>
                            <p class="text-xs font-bold text-gray-700 mt-0.5 uppercase">${activeProfile.title}</p>
                        </div>
                        <div class="col-span-5 border-l border-[#1F4E79] pl-3 text-[10px] text-gray-600 space-y-0.5">
                            <p>${activeProfile.contact.replace(/ \| /g, '<br>')}</p>
                        </div>
                    </div>
                    <div>
                        <h2 class="text-xs font-bold text-[#1F4E79] tracking-wide uppercase">Professional Summary</h2>
                        <p class="text-gray-600 mt-1 leading-relaxed text-justify">${activeProfile.summary}</p>
                    </div>
                    <div class="grid grid-cols-12 gap-6 mt-4 border-t border-gray-200 pt-3">
                        <div class="col-span-4 space-y-3">
                            ${activeProfile.skills.length ? `<div><h3 class="font-bold text-[#1F4E79] border-b pb-0.5 mb-1 text-[11px]">SKILLS</h3>
                            <ul class="space-y-1 text-gray-600 text-[11px]">${activeProfile.skills.map(s => `<li>• ${s}</li>`).join('')}</ul></div>` : ''}
                            ${activeProfile.education ? `<div><h3 class="font-bold text-[#1F4E79] border-b pb-0.5 mb-1 text-[11px]">EDUCATION</h3>
                            <p class="text-[10px] text-gray-600">${activeProfile.education}</p></div>` : ''}
                            ${activeProfile.certifications.length ? `<div><h3 class="font-bold text-[#1F4E79] border-b pb-0.5 mb-1 text-[11px]">CERTIFICATIONS</h3>
                            <ul class="space-y-1 text-gray-600 text-[10px]">${activeProfile.certifications.map(c => `<li>• ${c}</li>`).join('')}</ul></div>` : ''}
                            ${activeProfile.personal.length ? `<div><h3 class="font-bold text-[#1F4E79] border-b pb-0.5 mb-1 text-[11px]">PERSONAL DETAILS</h3>
                            <ul class="space-y-1 text-gray-600 text-[10px]">${activeProfile.personal.map(p => `<li>${p}</li>`).join('')}</ul></div>` : ''}
                        </div>
                        <div class="col-span-8 space-y-3">
                            ${activeProfile.achievements.length ? `<div><h3 class="font-bold text-[#1F4E79] border-b pb-0.5 mb-1 text-[11px]">ACHIEVEMENTS</h3>
                            <ul class="list-disc pl-4 text-gray-600 space-y-0.5">${activeProfile.achievements.map(ach => `<li>${ach}</li>`).join('')}</ul></div>` : ''}
                            <div><h3 class="font-bold text-[#1F4E79] border-b pb-0.5 mb-1 text-[11px]">EXPERIENCE</h3>
                            <div class="text-gray-600">${expFormatted}</div>
                        </div>
                    </div>
                `;
            }
            else if (currentActiveTemplate === 'global') {
                canvas.innerHTML = `
                    <div class="grid grid-cols-12 gap-4 border-b-2 border-green-800 pb-3 mb-2">
                        <div class="col-span-7">
                            <h1 class="text-2xl font-bold text-green-800">${activeProfile.name}</h1>
                            <p class="text-xs font-semibold text-gray-700 uppercase mt-0.5">${activeProfile.title}</p>
                        </div>
                        <div class="col-span-5 text-right text-[10px] text-gray-500 space-y-0.5">
                            <p>${activeProfile.contact.replace(/ \| /g, '<br>')}</p>
                        </div>
                    </div>
                    
                    <div class="space-y-4">
                        <div class="flex items-center space-x-2 my-2"><div class="flex-grow border-b border-green-700"></div><span class="text-[11px] font-bold text-green-800 uppercase tracking-wider">Professional Profile</span><div class="flex-grow border-b border-green-700"></div></div>
                        <p class="text-gray-600 leading-relaxed text-justify">${activeProfile.summary}</p>
                        
                        ${activeProfile.skills.length ? `<div class="flex items-center space-x-2 my-2"><div class="flex-grow border-b border-green-700"></div><span class="text-[11px] font-bold text-green-800 uppercase tracking-wider">Competencies</span><div class="flex-grow border-b border-green-700"></div></div>
                        <p class="text-center text-gray-600 font-medium text-[11px]">${activeProfile.skills.join('   •   ')}</p>` : ''}

                        ${activeProfile.achievements.length ? `<div class="flex items-center space-x-2 my-2"><div class="flex-grow border-b border-green-700"></div><span class="text-[11px] font-bold text-green-800 uppercase tracking-wider">Achievements</span><div class="flex-grow border-b border-green-700"></div></div>
                        <ul class="list-disc pl-4 text-gray-600 space-y-0.5">${activeProfile.achievements.map(ach => `<li>${ach}</li>`).join('')}</ul>` : ''}
