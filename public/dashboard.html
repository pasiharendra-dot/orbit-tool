<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Workspace | GetPerfectResume</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* DISALLOW HIGHLIGHTING & SELECTION */
        body, html, .protected-zone {
            user-select: none !important;
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
        }

        /* DIAGONAL PREVIEW WATERMARK BACKGROUND */
        .watermark-overlay {
            position: relative;
        }
        .watermark-overlay::before {
            content: "PREVIEW LOCKED • UNLOCK VIA DOWNLOAD • PREVIEW LOCKED • UNLOCK VIA DOWNLOAD • ";
            position: absolute;
            top: 0; left: 0; width: 200%; height: 200%;
            font-size: 22px;
            font-weight: 900;
            color: rgba(15, 59, 104, 0.035); /* Elegant ultra-faint brand text grid */
            transform: rotate(-15deg);
            pointer-events: none;
            z-index: 50;
            display: block;
            padding: 40px;
            overflow: hidden;
        }
        
        /* Layout Tuning for Previews */
        .preview-font { font-family: 'Calibri', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 font-sans protected-zone">

    <!-- Top Navigation Bar -->
    <nav class="bg-[#0F3B68] text-white px-6 py-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-2">
            <span class="font-bold text-xl tracking-wide">GetPerfectResume<span class="text-blue-400">.com</span></span>
            <span class="bg-blue-900 text-xs px-2 py-0.5 rounded text-blue-300 font-mono">Workspace v1.2</span>
        </div>
        <div class="flex items-center space-x-6">
            <div class="bg-blue-950 px-4 py-1.5 rounded-full text-sm font-semibold flex items-center space-x-2 border border-blue-800">
                <span class="inline-block w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
                <span>Tailor Credits: <span id="credit-count" class="text-yellow-400">2</span></span>
            </div>
            <button onclick="logout()" class="text-sm text-gray-300 hover:text-white transition">Sign Out</button>
        </div>
    </nav>

    <!-- Main Workspace Layout -->
    <div class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- LEFT PANEL: Dynamic Control & Optimization Form -->
        <div class="lg:col-span-5 bg-white rounded-xl shadow-sm border border-gray-200 p-6 space-y-6 max-h-[85vh] overflow-y-auto">
            <div>
                <h2 class="text-lg font-bold text-gray-900">Live Optimization Board</h2>
                <p class="text-xs text-gray-500">Tweak your details below. The protected framework on the right will sync instantly.</p>
            </div>
            
            <div class="bg-blue-50 border border-blue-100 rounded-lg p-4 space-y-3">
                <label class="block text-xs font-bold text-[#0F3B68] uppercase tracking-wider">AI Application Keyword Sync</label>
                <textarea id="new-jd-input" rows="3" class="w-full text-sm p-2.5 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#0F3B68]" placeholder="Paste target job description to match skills and metrics dynamically..."></textarea>
                <button onclick="spendCreditToTailor()" class="w-full bg-[#0F3B68] text-white font-bold py-2 px-4 rounded text-sm hover:bg-blue-800 transition shadow-sm">
                    Re-Tailor Resume layout (-1 Credit)
                </button>
            </div>

            <!-- Interactive Editing Fields -->
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1 uppercase tracking-wider">Full Name</label>
                    <input type="text" id="edit-name" value="AMIT SAXENA" class="w-full text-sm p-2.5 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-[#0F3B68]">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1 uppercase tracking-wider">Target Profile Title</label>
                    <input type="text" id="edit-title" value="DEPUTY GENERAL MANAGER | CHANNEL MANAGEMENT & P&L OVERSIGHT" class="w-full text-sm p-2.5 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-[#0F3B68]">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1 uppercase tracking-wider">Professional Profile Summary</label>
                    <textarea id="edit-summary" rows="5" class="w-full text-sm p-2.5 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-[#0F3B68]">Highly accomplished Executive with 27+ years of extensive experience driving strategic business development, market expansion, and channel management across diverse fast-paced consumer industries.</textarea>
                </div>
            </div>
        </div>

        <!-- RIGHT PANEL: Protected Framework Live Viewer -->
        <div class="lg:col-span-7 flex flex-col space-y-4">
            
            <!-- Context Control Bar -->
            <div class="flex flex-col sm:flex-row justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-gray-200 gap-4">
                <!-- Framework Picker Inside Dashboard -->
                <div class="flex bg-gray-100 p-1 rounded-lg border border-gray-200 w-full sm:w-auto">
                    <button id="btn-sentinel" onclick="switchPreviewTemplate('sentinel')" class="px-3 py-1.5 text-xs font-bold rounded-md bg-white text-[#0F3B68] shadow-sm transition">Sentinel (ATS)</button>
                    <button id="btn-vanguard" onclick="switchPreviewTemplate('vanguard')" class="px-3 py-1.5 text-xs font-bold rounded-md text-gray-600 hover:text-gray-900 transition">Vanguard</button>
                    <button id="btn-creative" onclick="switchPreviewTemplate('creative')" class="px-3 py-1.5 text-xs font-bold rounded-md text-gray-600 hover:text-gray-900 transition">Creative</button>
                    <button id="btn-global" onclick="switchPreviewTemplate('global')" class="px-3 py-1.5 text-xs font-bold rounded-md text-gray-600 hover:text-gray-900 transition">Global</button>
                </div>

                <button onclick="triggerPurchasePaywall()" class="w-full sm:w-auto bg-green-600 hover:bg-green-700 text-white font-bold text-sm px-6 py-2 rounded-lg shadow-sm transition flex items-center justify-center space-x-1">
                    <span>Download Raw Word Copy (.docx)</span>
                </button>
            </div>

            <!-- The Protected Document View Container -->
            <div class="bg-white rounded-xl shadow-md border border-gray-300 p-10 min-h-[78vh] watermark-overlay relative overflow-hidden preview-font" id="preview-frame">
                
                <!-- DYNAMIC RENDER SLOT -->
                <div id="workspace-canvas" class="space-y-4 text-xs text-gray-800">
                    <!-- Framework layers render here automatically via Javascript -->
                </div>

            </div>
        </div>

    </div>

    <!-- WORKSPACE FRAMEWORK CORE LOGIC -->
    <script>
        // Mock static profile data matrix (to populate the dashboard initially before backend binding)
        let activeProfile = {
            name: "AMIT SAXENA",
            title: "DEPUTY GENERAL MANAGER | CHANNEL MANAGEMENT & P&L OVERSIGHT",
            summary: "Highly accomplished Executive with 27+ years of extensive experience driving strategic business development, market expansion, and channel management across diverse fast-paced consumer industries.",
            phone: "+91 ●●●●●-●●●●●",
            email: "a****a0601@gmail.com",
            location: "New Delhi, India",
            linkedin: "linkedin.com/in/●●●●●●●",
            skills: ["Strategic Business Development", "Channel Management", "Key Account Management", "P&L Management", "Market Expansion", "Team Leadership", "Revenue Growth", "Market Analysis"],
            achievements: [
                "Achieved highest growth award in compressor segment scaling regional sales margins by 34%.",
                "Appointed 8 new strategic channel distribution partners within 2 years, securing emerging dealers recognition."
            ],
            experience: [
                { role: "Deputy General Manager - Business Development", company: "Samvardhana Motherson International", dates: "May 2025 – Present", bullets: ["Sales & Business Development: Led complete sales operations for India market segments.", "Team Leadership: Managed 9 high-performing team members to achieve annual operating targets."] }
            ],
            education: "Master of Business Administration (MBA) | University of Delhi"
        };

        let currentActiveTemplate = 'sentinel';

        // Initialize dashboard inputs and canvas loop
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('edit-name').value = activeProfile.name;
            document.getElementById('edit-title').value = activeProfile.title;
            document.getElementById('edit-summary').value = activeProfile.summary;

            // Wire up instant keystroke rendering tracking
            document.getElementById('edit-name').addEventListener('input', (e) => { activeProfile.name = e.target.value.toUpperCase(); renderCurrentCanvas(); });
            document.getElementById('edit-title').addEventListener('input', (e) => { activeProfile.title = e.target.value.toUpperCase(); renderCurrentCanvas(); });
            document.getElementById('edit-summary').addEventListener('input', (e) => { activeProfile.summary = e.target.value; renderCurrentCanvas(); });

            renderCurrentCanvas();
        });

        // Template Switcher UI Handler
        function switchPreviewTemplate(templateId) {
            currentActiveTemplate = templateId;
            
            // Toggle highlight classes on dashboard tabs
            ['sentinel', 'vanguard', 'creative', 'global'].forEach(id => {
                const btn = document.getElementById(`btn-${id}`);
                if (id === templateId) {
                    btn.className = "px-3 py-1.5 text-xs font-bold rounded-md bg-white text-[#0F3B68] shadow-sm transition";
                } else {
                    btn.className = "px-3 py-1.5 text-xs font-bold rounded-md text-gray-600 hover:text-gray-900 transition";
                }
            });

            renderCurrentCanvas();
        }

        // Master Layout Render Router
        function renderCurrentCanvas() {
            const canvas = document.getElementById('workspace-canvas');
            
            if (currentActiveTemplate === 'sentinel') {
                canvas.innerHTML = `
                    <div class="text-center border-b pb-3 border-blue-200">
                        <h1 class="text-2xl font-bold text-[#0F3B68] tracking-tight">${activeProfile.name}</h1>
                        <p class="text-xs font-bold text-gray-600 uppercase mt-1 tracking-wide">${activeProfile.title}</p>
                        <p class="text-[10px] text-gray-500 mt-1">${activeProfile.phone}  |  ${activeProfile.email}  |  ${activeProfile.location}</p>
                    </div>
                    <div>
                        <h2 class="text-xs font-bold text-[#0F3B68] border-b border-gray-200 pb-0.5 uppercase tracking-wider">Professional Summary</h2>
                        <p class="text-gray-600 mt-1.5 leading-relaxed text-justify">${activeProfile.summary}</p>
                    </div>
                    <div>
                        <h2 class="text-xs font-bold text-[#0F3B68] border-b border-gray-200 pb-0.5 uppercase tracking-wider mt-3">Achievements</h2>
                        <ul class="list-disc pl-4 mt-1.5 space-y-1 text-gray-600">
                            ${activeProfile.achievements.map(ach => `<li>${ach}</li>`).join('')}
                        </ul>
                    </div>
                    <div>
                        <h2 class="text-xs font-bold text-[#0F3B68] border-b border-gray-200 pb-0.5 uppercase tracking-wider mt-3">Experience</h2>
                        ${activeProfile.experience.map(job => `
                            <div class="mt-2">
                                <div class="flex justify-between font-bold text-gray-700"><span>${job.company}</span><span>${job.dates}</span></div>
                                <p class="italic text-gray-600 text-[11px] font-semibold">${job.role}</p>
                                <ul class="list-disc pl-4 mt-1 space-y-0.5 text-gray-600">
                                    ${job.bullets.map(b => `<li>${b}</li>`).join('')}
                                </ul>
                            </div>
                        `).join('')}
                    </div>
                `;
            } 
            else if (currentActiveTemplate === 'vanguard') {
                canvas.innerHTML = `
                    <div class="grid grid-cols-12 gap-4">
                        <div class="col-span-4 bg-[#0F3B68] text-white p-4 rounded-lg space-y-4 min-h-[60vh]">
                            <div class="text-center text-[10px] text-blue-300 border border-blue-800 py-4 rounded">Placeholder Photo Area</div>
                            <div>
                                <h3 class="font-bold border-b border-blue-400 text-[11px] tracking-wider mb-1.5">CONTACT</h3>
                                <p class="text-[10px] space-y-1 opacity-90">${activeProfile.phone}<br>${activeProfile.email}<br>${activeProfile.location}</p>
                            </div>
                            <div>
                                <h3 class="font-bold border-b border-blue-400 text-[11px] tracking-wider mb-1.5">SKILLS</h3>
                                <ul class="text-[10px] space-y-1 opacity-90">${activeProfile.skills.map(s => `<li>• ${s}</li>`).join('')}</ul>
                            </div>
                        </div>
                        <div class="col-span-8 p-2 space-y-3">
                            <div>
                                <h1 class="text-2xl font-bold text-[#0F3B68]">${activeProfile.name}</h1>
                                <p class="text-xs font-bold text-amber-600 mt-0.5 uppercase">${activeProfile.title}</p>
                            </div>
                            <div>
                                <h3 class="font-bold text-[#0F3B68] border-b border-gray-200 pb-0.5 uppercase text-[11px]">Professional Summary</h3>
                                <p class="text-gray-600 mt-1 leading-relaxed text-justify">${activeProfile.summary}</p>
                            </div>
                            <div>
                                <h3 class="font-bold text-[#0F3B68] border-b border-gray-200 pb-0.5 uppercase text-[11px] mt-2">Achievements</h3>
                                <ul class="list-disc pl-4 mt-1 text-gray-600 space-y-0.5">${activeProfile.achievements.map(ach => `<li>${ach}</li>`).join('')}</ul>
                            </div>
                            <div>
                                <h3 class="font-bold text-[#0F3B68] border-b border-gray-200 pb-0.5 uppercase text-[11px] mt-2">Experience</h3>
                                ${activeProfile.experience.map(job => `
                                    <div class="mt-1.5">
                                        <div class="flex justify-between font-bold text-gray-800"><span>${job.role}</span><span class="text-gray-500 font-normal">${job.dates}</span></div>
                                        <p class="text-amber-600 font-bold text-[10px]">${job.company}</p>
                                        <ul class="list-disc pl-4 mt-1 text-gray-600 space-y-0.5">${job.bullets.map(b => `<li>${b}</li>`).join('')}</ul>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }
            else if (currentActiveTemplate === 'creative') {
                canvas.innerHTML = `
                    <div class="grid grid-cols-12 gap-6 border-b-2 border-[#1F4E79] pb-3 mb-3">
                        <div class="col-span-7">
                            <h1 class="text-2xl font-bold text-[#1F4E79]">${activeProfile.name}</h1>
                            <p class="text-xs font-bold text-gray-700 mt-0.5 uppercase">${activeProfile.title}</p>
                        </div>
                        <div class="col-span-5 border-l border-[#1F4E79] pl-3 text-[10px] text-gray-600 space-y-0.5">
                            <p><b>Phone:</b> ${activeProfile.phone}</p><p><b>Email:</b> ${activeProfile.email}</p><p><b>Loc:</b> ${activeProfile.location}</p>
                        </div>
                    </div>
                    <div>
                        <h2 class="text-xs font-bold text-[#1F4E79] tracking-wide uppercase">Professional Summary</h2>
                        <p class="text-gray-600 mt-1 leading-relaxed text-justify">${activeProfile.summary}</p>
                    </div>
                    <div class="grid grid-cols-12 gap-6 mt-4 border-t border-gray-200 pt-3">
                        <div class="col-span-4 space-y-3">
                            <div><h3 class="font-bold text-[#1F4E79] border-b pb-0.5 mb-1">SKILLS</h3>
                            <ul class="space-y-1 text-gray-600">${activeProfile.skills.map(s => `<li>• ${s}</li>`).join('')}</ul></div>
                            <div><h3 class="font-bold text-[#1F4E79] border-b pb-0.5 mb-1">EDUCATION</h3>
                            <p class="text-[10px] text-gray-600">${activeProfile.education}</p></div>
                        </div>
                        <div class="col-span-8 space-y-3">
                            <div><h3 class="font-bold text-[#1F4E79] border-b pb-0.5 mb-1">ACHIEVEMENTS</h3>
                            <ul class="list-disc pl-4 text-gray-600 space-y-0.5">${activeProfile.achievements.map(ach => `<li>${ach}</li>`).join('')}</ul></div>
                            <div><h3 class="font-bold text-[#1F4E79] border-b pb-0.5 mb-1">EXPERIENCE</h3>
                            ${activeProfile.experience.map(job => `
                                <div class="mt-1">
                                    <div class="flex justify-between font-bold text-gray-800"><span>${job.role}</span><span>${job.dates}</span></div>
                                    <p class="text-[#1F4E79] italic font-semibold">${job.company}</p>
                                    <ul class="list-disc pl-4 mt-0.5 text-gray-600 space-y-0.5">${job.bullets.map(b => `<li>${b}</li>`).join('')}</ul>
                                </div>
                            `).join('')}</div>
                        </div>
                    </div>
                `;
            }
            else if (currentActiveTemplate === 'global') {
                canvas.innerHTML = `
                    <div class="grid grid-cols-12 gap-4 border-b-2 border-green-800 pb-3 mb-2">
                        <div class="col-span-7">
                            <h1 class="text-2xl font-bold text-green-800">${activeProfile.name}</h1>
                            <p class="text-xs font-semibold text-gray-700 uppercase mt-0.5">${activeProfile.title}</p>
                        </div>
                        <div class="col-span-5 text-right text-[10px] text-gray-500 space-y-0.5">
                            <p>${activeProfile.location}</p><p>${activeProfile.email}</p><p>${activeProfile.phone}</p>
                        </div>
                    </div>
                    
                    <div class="space-y-4">
                        <!-- Simulated Autofit Margin Lines -->
                        <div class="flex items-center space-x-2 my-2"><div class="flex-grow border-b border-green-700"></div><span class="text-xs font-bold text-green-800 uppercase tracking-wider">Professional Profile</span><div class="flex-grow border-b border-green-700"></div></div>
                        <p class="text-gray-600 leading-relaxed text-justify">${activeProfile.summary}</p>
                        
                        <div class="flex items-center space-x-2 my-2"><div class="flex-grow border-b border-green-700"></div><span class="text-xs font-bold text-green-800 uppercase tracking-wider">Competencies</span><div class="flex-grow border-b border-green-700"></div></div>
                        <p class="text-center text-gray-600 font-medium">${activeProfile.skills.join('   •   ')}</p>

                        <div class="flex items-center space-x-2 my-2"><div class="flex-grow border-b border-green-700"></div><span class="text-xs font-bold text-green-800 uppercase tracking-wider">Achievements</span><div class="flex-grow border-b border-green-700"></div></div>
                        <ul class="list-disc pl-4 text-gray-600 space-y-0.5">${activeProfile.achievements.map(ach => `<li>${ach}</li>`).join('')}</ul>

                        <div class="flex items-center space-x-2 my-2"><div class="flex-grow border-b border-green-700"></div><span class="text-xs font-bold text-green-800 uppercase tracking-wider">Career Summary</span><div class="flex-grow border-b border-green-700"></div></div>
                        ${activeProfile.experience.map(job => `
                            <div class="mt-1">
                                <div class="flex justify-between font-bold text-gray-800"><span>${job.role}</span><span>${job.dates}</span></div>
                                <p class="text-gray-500 italic text-[10px]">${job.company}</p>
                                <ul class="list-disc pl-4 text-gray-600 space-y-0.5">${job.bullets.map(b => `<li>${b}</li>`).join('')}</ul>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
        }

        // ==========================================
        // BEHAVIORAL PROTECTION CONTROLS (Anti-Theft)
        // ==========================================
        document.addEventListener('contextmenu', event => event.preventDefault());

        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey || e.metaKey) {
                if (['c', 'C', 'x', 'X', 's', 'S', 'p', 'P'].includes(e.key)) {
                    e.preventDefault();
                    alert("Security Shield Active: Watermarked preview locked. Complete standard verification to release the editable Word Document framework.");
                }
            }
        });

        document.addEventListener('dragstart', event => event.preventDefault());

        function spendCreditToTailor() {
            alert("Contacting parser... Keyword matrix injected. Deducting 1 application credit framework.");
        }

        function triggerPurchasePaywall() {
            alert("Launching Razorpay security handler verification layer (₹199 entry sequence)...");
        }

        function logout() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
