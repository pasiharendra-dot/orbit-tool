<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Workspace | GetPerfectResume</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body, html, .protected-zone { user-select: none !important; -webkit-user-select: none !important; }
        .watermark-overlay { position: relative; }
        .watermark-overlay::before {
            content: "PREVIEW LOCKED • UNLOCK VIA DOWNLOAD";
            position: absolute; top: 0; left: 0; width: 200%; height: 200%;
            font-size: 22px; font-weight: 900; color: rgba(15, 59, 104, 0.035);
            transform: rotate(-15deg); pointer-events: none; z-index: 50; padding: 40px;
        }
        .preview-font { font-family: 'Calibri', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 protected-zone flex flex-col min-h-screen">

    <nav class="bg-[#0F3B68] text-white px-6 py-3 flex justify-between items-center shadow-md shrink-0">
        <div class="flex items-center space-x-3">
            <img src="/logo.png" alt="Logo" class="h-8 object-contain bg-white rounded p-0.5" onerror="this.style.display='none'">
            <span class="bg-blue-900 text-[10px] px-2 py-0.5 rounded text-blue-300 font-mono hidden md:inline-block">Workspace v1.5</span>
        </div>
        <div class="flex items-center space-x-4">
            <div class="bg-blue-950 px-4 py-1.5 rounded-full text-xs font-semibold flex items-center space-x-2 border border-blue-800">
                <span id="save-indicator" class="inline-block w-2 h-2 rounded-full bg-green-400"></span>
                <span>Credits: <span id="credit-count" class="text-yellow-400">2</span></span>
            </div>
            <button onclick="logout()" class="text-xs text-gray-300 hover:text-white transition">Sign Out</button>
        </div>
    </nav>

    <div class="max-w-[1400px] w-full mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-8 flex-grow">
        <div class="lg:col-span-4 bg-white rounded-xl shadow-sm border border-gray-200 p-5 space-y-4 max-h-[82vh] overflow-y-auto">
            <h2 class="text-lg font-bold text-gray-900">Live Editor</h2>
            <div><label class="block text-[10px] font-bold uppercase">Name</label><input type="text" id="edit-name" class="w-full text-xs p-2 border border-gray-300 rounded"></div>
            <div><label class="block text-[10px] font-bold uppercase">Title</label><input type="text" id="edit-title" class="w-full text-xs p-2 border border-gray-300 rounded"></div>
            <div><label class="block text-[10px] font-bold uppercase">Summary</label><textarea id="edit-summary" rows="4" class="w-full text-xs p-2 border border-gray-300 rounded"></textarea></div>
            <div><label class="block text-[10px] font-bold uppercase">Skills</label><textarea id="edit-skills" rows="3" class="w-full text-xs p-2 border border-gray-300 rounded"></textarea></div>
            <div><label class="block text-[10px] font-bold uppercase">Achievements</label><textarea id="edit-achievements" rows="3" class="w-full text-xs p-2 border border-gray-300 rounded"></textarea></div>
            <div><label class="block text-[10px] font-bold uppercase">Experience</label><textarea id="edit-experience" rows="5" class="w-full text-xs p-2 border border-gray-300 rounded"></textarea></div>
            <div><label class="block text-[10px] font-bold uppercase">Education</label><textarea id="edit-education" rows="2" class="w-full text-xs p-2 border border-gray-300 rounded"></textarea></div>
        </div>

        <div class="lg:col-span-8 flex flex-col space-y-4">
            <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                <div class="flex bg-gray-100 p-1 rounded-lg">
                    <button id="btn-sentinel" onclick="switchPreviewTemplate('sentinel')" class="px-3 py-1.5 text-xs font-bold rounded-md bg-white text-[#0F3B68]">Sentinel</button>
                    <button id="btn-vanguard" onclick="switchPreviewTemplate('vanguard')" class="px-3 py-1.5 text-xs font-bold rounded-md text-gray-600">Vanguard</button>
                </div>
                <button onclick="triggerPurchasePaywall()" class="bg-green-600 text-white font-bold text-xs px-5 py-2 rounded-lg">Download .docx</button>
            </div>
            <div class="bg-white rounded-xl shadow-md border border-gray-300 p-10 min-h-[70vh] overflow-y-auto watermark-overlay relative preview-font" id="preview-frame">
                <div id="workspace-canvas" class="space-y-4 text-xs text-gray-800 relative z-10"></div>
            </div>
        </div>
    </div>

    <script>
        const supabase = supabase.createClient('https://vkiitostqcjkiyflcjhu.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZraWl0b3N0cWNqa2l5Zmxjamh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3MTgyNDEsImV4cCI6MjA5NTI5NDI0MX0.a1vvLGJPEJ9l7v3HgHQQ4dIRs8HLN8IEPuGqnm-lHC4');

        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            
            // Auto-render on input
            const fields = ['name', 'title', 'summary', 'skills', 'achievements', 'experience', 'education'];
            fields.forEach(f => {
                document.getElementById('edit-'+f).addEventListener('input', renderCurrentCanvas);
            });
            renderCurrentCanvas();
        });

        function renderCurrentCanvas() {
            // This function takes values from the inputs and pushes them to 'workspace-canvas'
            // (You already have the full logic for this, just ensure the IDs match)
            document.getElementById('workspace-canvas').innerHTML = "<h1>" + document.getElementById('edit-name').value + "</h1>..."; 
        }

        function switchPreviewTemplate(t) { currentActiveTemplate = t; renderCurrentCanvas(); }
        function logout() { window.location.href = 'index.html'; }
        function triggerPurchasePaywall() { /* Your modal code here */ }
    </script>
</body>
</html>
