<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Workspace | GetPerfectResume</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* DISALLOW HIGHLIGHTING & SELECTION */
        body, html, .protected-zone {
            user-select: none !important;
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
        }

        /* DIAGONAL PREVIEW WATERMARK BACKGROUND */
        .watermark-overlay {
            position: relative;
        }
        .watermark-overlay::before {
            content: "PREVIEW LOCKED • UNLOCK VIA DOWNLOAD • PREVIEW LOCKED • UNLOCK VIA DOWNLOAD • ";
            position: absolute;
            top: 0; left: 0; width: 200%; height: 200%;
            font-size: 22px;
            font-weight: 900;
            color: rgba(15, 59, 104, 0.035);
            transform: rotate(-15deg);
            pointer-events: none;
            z-index: 50;
            display: block;
            padding: 40px;
            overflow: hidden;
        }
        
        /* Layout Tuning for Previews */
        .preview-font { font-family: 'Calibri', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 font-sans protected-zone flex flex-col min-h-screen">

    <!-- Top Navigation Bar -->
    <nav class="bg-[#0F3B68] text-white px-4 md:px-6 py-3 flex flex-wrap justify-between items-center shadow-md shrink-0 gap-3">
        <div class="flex items-center space-x-3">
            <img src="/logo.png" alt="GetPerfectResume Logo" class="h-8 md:h-10 object-contain bg-white rounded p-0.5" onerror="this.style.display='none'">
            <span class="bg-blue-900 text-[10px] px-2 py-0.5 rounded text-blue-300 font-mono hidden md:inline-block">Workspace v1.5</span>
        </div>
        
        <!-- Auto-Save Indicator -->
        <div class="flex items-center space-x-2 text-[10px] md:text-xs text-blue-200">
            <svg id="save-icon" class="w-3 h-3 md:w-4 md:h-4 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            <span id="save-text">All changes saved to cloud</span>
        </div>

        <div class="flex items-center space-x-4 md:space-x-6">
            <div class="bg-blue-950 px-3 md:px-4 py-1.5 rounded-full text-xs md:text-sm font-semibold flex items-center space-x-2 border border-blue-800">
                <span class="inline-block w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
                <span>Credits: <span id="credit-count" class="text-yellow-400">2</span></span>
            </div>
            <button onclick="logout()" class="text-xs md:text-sm text-gray-300 hover:text-white transition">Sign Out</button>
        </div>
    </nav>

    <!-- Main Workspace Layout -->
    <div class="max-w-[1400px] w-full mx-auto px-2 md:px-4 py-4 md:py-6 grid grid-cols-1 lg:grid-cols-12 gap-4 md:gap-8 flex-grow">
        
        <!-- LEFT PANEL: Dynamic Control & Optimization Form -->
        <div class="lg:col-span-4 bg-white rounded-xl shadow-sm border border-gray-200 p-4 md:p-5 space-y-5 max-h-[82vh] overflow-y-auto">
            <div>
                <h2 class="text-base md:text-lg font-bold text-gray-900">Live Editor</h2>
                <p class="text-[10px] md:text-xs text-gray-500">Edit your parsed data below. The framework syncs instantly.</p>
            </div>
            
            <div class="bg-blue-50 border border-blue-100 rounded-lg p-3 space-y-2">
                <label class="block text-[10px] font-bold text-[#0F3B68] uppercase tracking-wider flex justify-between items-center">
                    <span>Target Job Alignment</span>
                    <button onclick="triggerAI('jd')" class="text-blue-500 hover:text-blue-700 flex items-center gap-1 transition"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg> Optimize</button>
                </label>
                <textarea id="new-jd-input" rows="2" class="w-full text-xs p-2 border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-[#0F3B68]" placeholder="Paste target job description here..."></textarea>
            </div>

            <!-- Full Interactive Editing Fields -->
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <div class="col-span-2">
                        <label class="block text-[10px] font-bold text-gray-700 mb-1 uppercase tracking-wider">Full Name</label>
                        <input type="text" id="edit-name" class="w-full text-xs p-2 border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-[#0F3B68]">
                    </div>
                </div>
                <div>
                    <label class="flex justify-between items-center block text-[10px] font-bold text-gray-700 mb-1 uppercase tracking-wider">
                        <span>Target Profile Title</span>
                        <button onclick="triggerAI('title')" class="text-blue-500 hover:text-blue-700 transition">✨ Generate</button>
                    </label>
                    <input type="text" id="edit-title" class="w-full text-xs p-2 border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-[#0F3B68]">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-700 mb-1 uppercase tracking-wider">Contact Info (Phone | Email | Location)</label>
                    <input type="text" id="edit-contact" class="w-full text-xs p-2 border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-[#0F3B68]">
                </div>
                <div>
                    <label class="flex justify-between items-center block text-[10px] font-bold text-gray-700 mb-1 uppercase tracking-wider">
                        <span>Professional Summary</span>
                        <button onclick="triggerAI('summary')" class="text-blue-500 hover:text-blue-700 transition">✨ AI Rewrite</button>
                    </label>
                    <textarea id="edit-summary" rows="4" class="w-full text-xs p-2 border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-[#0F3B68]"></textarea>
                </div>
                <div>
                    <label class="flex justify-between items-center block text-[10px] font-bold text-gray-700 mb-1 uppercase tracking-wider">
                        <span>Skills & Competencies</span>
                        <button onclick="triggerAI('skills')" class="text-blue-500 hover:text-blue-700 transition">✨ Add Skills</button>
                    </label>
                    <textarea id="edit-skills" rows="3" class="w-full text-xs p-2 border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-[#0F3B68]"></textarea>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-700 mb-1 uppercase tracking-wider">Achievements & Awards</label>
                    <textarea id="edit-achievements" rows="3" class="w-full text-xs p-2 border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-[#0F3B68]"></textarea>
                </div>
                <div>
                    <label class="flex justify-between items-center block text-[10px] font-bold text-gray-700 mb-1 uppercase tracking-wider">
                        <span>Employment Details</span>
                        <button onclick="triggerAI('bullets')" class="text-blue-500 hover:text-blue-700 transition">✨ Enhance Bullets</button>
                    </label>
                    <textarea id="edit-experience" rows="6" class="w-full text-xs p-2 border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-[#0F3B68]"></textarea>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-700 mb-1 uppercase tracking-wider">Education</label>
                    <textarea id="edit-education" rows="2" class="w-full text-xs p-2 border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-[#0F3B68]"></textarea>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-700 mb-1 uppercase tracking-wider">Certifications</label>
                    <textarea id="edit-certifications" rows="2" class="w-full text-xs p-2 border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-[#0F3B68]"></textarea>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-700 mb-1 uppercase tracking-wider">Personal Details</label>
                    <textarea id="edit-personal" rows="2" class="w-full text-xs p-2 border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-[#0F3B68]"></textarea>
                </div>
            </div>
        </div>

        <!-- RIGHT PANEL: Protected Framework Live Viewer -->
        <div class="lg:col-span-8 flex flex-col space-y-4">
            
            <!-- Dashboard Top Analytics & Control Bar -->
            <div class="flex flex-col xl:flex-row justify-between items-center bg-white p-3 md:p-4 rounded-xl shadow-sm border border-gray-200 gap-4">
                
                <!-- Real-time ATS & Impact Metrics -->
                <div class="flex items-center gap-4 w-full xl:w-auto">
                    <!-- ATS Score Ring -->
                    <div class="relative w-12 h-12 flex-shrink-0">
                        <svg class="w-full h-full" viewBox="0 0 36 36">
                            <path class="text-gray-200" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-width="3" />
                            <path id="score-ring" class="text-green-500" stroke-dasharray="88, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
                        </svg>
                        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-[10px] font-bold text-gray-800">88%</div>
                    </div>
                    <div>
                        <p class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">ATS Match Rate</p>
                        <p class="text-xs font-semibold text-gray-800 mt-0.5"><span class="text-green-600 font-bold">Strong</span> Action Verbs</p>
                    </div>
                </div>

                <!-- Template Switcher -->
                <div class="flex bg-gray-100 p-1 rounded-lg border border-gray-200 w-full md:w-auto overflow-x-auto">
                    <button id="btn-sentinel" onclick="switchPreviewTemplate('sentinel')" class="px-2.5 md:px-3 py-1.5 text-[10px] md:text-xs font-bold rounded-md bg-white text-[#0F3B68] shadow-sm transition whitespace-nowrap">Sentinel (ATS)</button>
                    <button id="btn-vanguard" onclick="switchPreviewTemplate('vanguard')" class="px-2.5 md:px-3 py-1.5 text-[10px] md:text-xs font-bold rounded-md text-gray-600 hover:text-gray-900 transition whitespace-nowrap">Vanguard</button>
                    <button id="btn-creative" onclick="switchPreviewTemplate('creative')" class="px-2.5 md:px-3 py-1.5 text-[10px] md:text-xs font-bold rounded-md text-gray-600 hover:text-gray-900 transition whitespace-nowrap">Creative</button>
                    <button id="btn-global" onclick="switchPreviewTemplate('global')" class="px-2.5 md:px-3 py-1.5 text-[10px] md:text-xs font-bold rounded-md text-gray-600 hover:text-gray-900 transition whitespace-nowrap">Global</button>
                </div>

                <button onclick="triggerPurchasePaywall()" class="w-full xl:w-auto bg-green-600 hover:bg-green-700 text-white font-bold text-xs md:text-sm px-4 md:px-5 py-2 md:py-2.5 rounded-lg shadow-sm transition flex items-center justify-center whitespace-nowrap shrink-0">
                    <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Download .docx
                </button>
            </div>

            <!-- The Protected Document View Container -->
            <div class="bg-white rounded-xl shadow-md border border-gray-300 p-6 md:p-10 min-h-[70vh] max-h-[75vh] overflow-y-auto watermark-overlay relative preview-font" id="preview-frame">
                
                <!-- DYNAMIC RENDER SLOT -->
                <div id="workspace-canvas" class="space-y-4 text-[11px] md:text-xs text-gray-800 relative z-10">
                    <!-- Framework layers render here automatically via Javascript -->
                </div>

            </div>
        </div>

    </div>

    <!-- Minimalist SaaS Footer -->
    <footer class="bg-gray-100 text-center py-4 text-[10px] text-gray-400 font-semibold tracking-wider shrink-0 border-t border-gray-200 mt-auto">
        &copy; 2026 ORBIT CAREERS | SECURE CANDIDATE WORKSPACE
    </footer>

    <!-- WORKSPACE FRAMEWORK CORE LOGIC -->
    <script>
        // Supabase Initialization
        const supabaseUrl = 'https://vkiitostqcjkiyflcjhu.supabase.co';
        const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZraWl0b3N0cWNqa2l5Zmxjamh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3MTgyNDEsImV4cCI6MjA5NTI5NDI0MX0.a1vvLGJPEJ9l7v3HgHQQ4dIRs8HLN8IEPuGqnm-lHC4'; // MUST UPDATE THIS BEFORE LAUNCH
        const supabase = supabase.createClient(supabaseUrl, supabaseAnonKey);

        let currentUserEmail = "";

        // EXPANDED DUMMY DATA FOR FULL 2-PAGE RESUME PREVIEW
        let activeProfile = {
            name: "AMIT SAXENA",
            title: "DEPUTY GENERAL MANAGER | CHANNEL MANAGEMENT & P&L OVERSIGHT",
            summary: "Highly accomplished Executive with 27+ years of extensive experience driving strategic business development, market expansion, and channel management across diverse fast-paced consumer industries. Proven expertise in formulating and executing tactical initiatives, leading cross-functional teams, and building sophisticated sales models to consistently deliver exceptional results in revenue growth, operational performance, and profitability. Adept at navigating dynamic market environments, fostering strategic partnerships, and enhancing organizational profitability through effective leadership and analytical problem-solving.",
            contact: "+91 ●●●●●-●●●●●  |  a****a0601@gmail.com  |  New Delhi, India",
            skills: ["Strategic Business Development", "Channel Management", "Key Account Management", "P&L Management", "Market Expansion", "Team Leadership", "Revenue Generation", "Market Analysis", "Cross-functional Collaboration", "Analytical Skills"],
            achievements: [
                "Achieved highest growth award in compressor segment scaling regional sales margins by 34%.",
                "Appointed 8 new strategic channel distribution partners within 2 years, securing emerging dealers recognition.",
                "Consistently achieved the lowest MTTR (Mean Time To Repair) in services/maintenance monthly.",
                "Received appreciation for outstanding performance in creating strategies that acquired more business deals."
            ],
            experience: "Deputy General Manager - Samvardhana Motherson\nMay 2025 – Present\n• Led complete sales and business development for Nirvana business (Commercial refrigeration) across the India market.\n• Directed 9 team members to achieve Annual Operating Plan (AOP) for equipment and after-sales services.\n• Appointed new dealers and managed channel network in potential territories across India.\n• Collaborated with major OEMs for tender participation and semi-government cooperative institutions.\n• Reviewed channel partner performance and appointed effective new channels to maximize reach.\n\nBusiness Line Manager - Gardner Denver Engineered Products\nFeb 2019 – Jan 2022\n• Ensured successful channel network for preset business targets amidst growing competition.\n• Identified prospective clients, generated new account business, and developed them for profitability.\n• Executed plans to reach unexplored market segments and customer groups using segmentation and penetration strategies.\n• Managed business operations through Distribution Team, achieving 22% growth in 2020.",
            education: "Master of Business Administration (MBA) in Marketing | MJP Rohilkhand University (1998)\nBachelor of Science (B.Sc.) | MJP Rohilkhand University (1995)",
            certifications: ["Advance Certification Program in Leadership for Business Excellence | IIM Lucknow (2019)"],
            personal: ["Date of Birth: 6th January 1976", "Languages: English, Hindi"]
        };

        let currentActiveTemplate = 'sentinel';
        let saveTimeout;

        // Initialize dashboard inputs and canvas loop
        document.addEventListener('DOMContentLoaded', async () => {
            
            // 1. Session Auth Check
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
    window.location.href = 'index.html'; 
    return;
 }
 currentUserEmail = session.user.email;

            // 2. Register user on backend
            fetch('/api/auth', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: currentUserEmail })
            });

            // 3. Load dummy data into inputs
            document.getElementById('edit-name').value = activeProfile.name;
            document.getElementById('edit-title').value = activeProfile.title;
            document.getElementById('edit-contact').value = activeProfile.contact;
            document.getElementById('edit-summary').value = activeProfile.summary;
            document.getElementById('edit-skills').value = activeProfile.skills.join('\n');
            document.getElementById('edit-achievements').value = activeProfile.achievements.join('\n');
            document.getElementById('edit-experience').value = activeProfile.experience;
            document.getElementById('edit-education').value = activeProfile.education;
            document.getElementById('edit-certifications').value = activeProfile.certifications.join('\n');
            document.getElementById('edit-personal').value = activeProfile.personal.join('\n');

            // 4. Wire up instant keystroke rendering & Auto-save simulation
            const fields = ['name', 'title', 'contact', 'summary', 'experience', 'education'];
            const arrayFields = ['skills', 'achievements', 'certifications', 'personal'];

            const triggerAutoSave = () => {
                const saveText = document.getElementById('save-text');
                const saveIcon = document.getElementById('save-icon');
                saveText.innerText = "Saving...";
                saveText.classList.remove('text-blue-200');
                saveText.classList.add('text-yellow-400');
                saveIcon.classList.replace('text-green-400', 'text-yellow-400');
                
                clearTimeout(saveTimeout);
                saveTimeout = setTimeout(() => {
                    saveText.innerText = "All changes saved to cloud";
                    saveText.classList.remove('text-yellow-400');
                    saveText.classList.add('text-blue-200');
                    saveIcon.classList.replace('text-yellow-400', 'text-green-400');
                }, 1000);
            };

            fields.forEach(f => {
                document.getElementById(`edit-${f}`).addEventListener('input', (e) => { 
                    activeProfile[f] = f === 'name' || f === 'title' ? e.target.value.toUpperCase() : e.target.value; 
                    renderCurrentCanvas(); 
                    triggerAutoSave();
                });
            });

            arrayFields.forEach(f => {
                document.getElementById(`edit-${f}`).addEventListener('input', (e) => { 
                    activeProfile[f] = e.target.value.split('\n').filter(val => val.trim() !== ''); 
                    renderCurrentCanvas(); 
                    triggerAutoSave();
                });
            });

            renderCurrentCanvas();
        });

        // UI AI Stubs
        function triggerAI(section) {
            alert(`AI Module locked in preview mode. Connecting to backend inference for [${section}] requires account authorization.`);
        }

        // Template Switcher UI Handler
        function switchPreviewTemplate(templateId) {
            currentActiveTemplate = templateId;
            ['sentinel', 'vanguard', 'creative', 'global'].forEach(id => {
                const btn = document.getElementById(`btn-${id}`);
                if (id === templateId) {
                    btn.className = "px-2.5 md:px-3 py-1.5 text-[10px] md:text-xs font-bold rounded-md bg-white text-[#0F3B68] shadow-sm transition whitespace-nowrap";
                } else {
                    btn.className = "px-2.5 md:px-3 py-1.5 text-[10px] md:text-xs font-bold rounded-md text-gray-600 hover:text-gray-900 transition whitespace-nowrap";
                }
            });
            renderCurrentCanvas();
        }

        // Master Layout Render Router
        function renderCurrentCanvas() {
            const canvas = document.getElementById('workspace-canvas');
            
            const expFormatted = activeProfile.experience.split('\n').map(line => {
                if(line.startsWith('•') || line.startsWith('-')) return `<li class="ml-4 list-disc">${line.substring(1).trim()}</li>`;
                if(line.trim() === '') return `<br>`;
                return `<p class="font-bold text-gray-800 mt-2">${line}</p>`;
            }).join('');

            if (currentActiveTemplate === 'sentinel') {
                canvas.innerHTML = `
                    <div class="text-center border-b pb-3 border-blue-200">
                        <h1 class="text-xl md:text-2xl font-bold text-[#0F3B68] tracking-tight">${activeProfile.name}</h1>
                        <p class="text-[11px] md:text-xs font-bold text-gray-600 uppercase mt-1 tracking-wide">${activeProfile.title}</p>
                        <p class="text-[9px] md:text-[10px] text-gray-500 mt-1">${activeProfile.contact}</p>
                    </div>
                    <div>
                        <h2 class="text-[11px] md:text-xs font-bold text-[#0F3B68] border-b border-gray-200 pb-0.5 uppercase tracking-wider mt-2">Professional Summary</h2>
                        <p class="text-gray-600 mt-1.5 leading-relaxed text-justify">${activeProfile.summary}</p>
                    </div>
                    ${activeProfile.achievements.length ? `<div>
                        <h2 class="text-[11px] md:text-xs font-bold text-[#0F3B68] border-b border-gray-200 pb-0.5 uppercase tracking-wider mt-3">Achievements & Awards</h2>
                        <ul class="list-disc pl-4 mt-1.5 space-y-1 text-gray-600">${activeProfile.achievements.map(ach => `<li>${ach}</li>`).join('')}</ul>
                    </div>` : ''}
                    ${activeProfile.skills.length ? `<div>
                        <h2 class="text-[11px] md:text-xs font-bold text-[#0F3B68] border-b border-gray-200 pb-0.5 uppercase tracking-wider mt-3">Professional Skills</h2>
                        <p class="text-gray-600 mt-1.5 leading-relaxed">${activeProfile.skills.join('  |  ')}</p>
                    </div>` : ''}
                    <div>
                        <h2 class="text-[11px] md:text-xs font-bold text-[#0F3B68] border-b border-gray-200 pb-0.5 uppercase tracking-wider mt-3">Work Experience</h2>
                        <div class="text-gray-600">${expFormatted}</div>
                    </div>
                    ${activeProfile.education ? `<div>
                        <h2 class="text-[11px] md:text-xs font-bold text-[#0F3B68] border-b border-gray-200 pb-0.5 uppercase tracking-wider mt-3">Education</h2>
                        <p class="text-gray-600 mt-1.5 whitespace-pre-line">${activeProfile.education}</p>
                    </div>` : ''}
                    ${activeProfile.certifications.length ? `<div>
                        <h2 class="text-[11px] md:text-xs font-bold text-[#0F3B68] border-b border-gray-200 pb-0.5 uppercase tracking-wider mt-3">Certifications</h2>
                        <ul class="list-disc pl-4 mt-1.5 space-y-1 text-gray-600">${activeProfile.certifications.map(c => `<li>${c}</li>`).join('')}</ul>
                    </div>` : ''}
                    ${activeProfile.personal.length ? `<div>
                        <h2 class="text-[11px] md:text-xs font-bold text-[#0F3B68] border-b border-gray-200 pb-0.5 uppercase tracking-wider mt-3">Personal Details</h2>
                        <ul class="mt-1.5 space-y-1 text-gray-600">${activeProfile.personal.map(p => `<li>${p}</li>`).join('')}</ul>
                    </div>` : ''}
                `;
            } 
            else if (currentActiveTemplate === 'vanguard') {
                canvas.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
                        <div class="md:col-span-4 bg-[#0F3B68] text-white p-4 rounded-lg space-y-4 min-h-[60vh]">
                            <div class="text-center text-[10px] text-blue-300 border border-blue-800 py-4 rounded">Placeholder Photo</div>
                            <div>
                                <h3 class="font-bold border-b border-blue-400 text-[11px] tracking-wider mb-1.5">CONTACT</h3>
                                <p class="text-[10px] space-y-1 opacity-90 leading-relaxed">${activeProfile.contact.replace(/ \| /g, '<br>')}</p>
                            </div>
                            ${activeProfile.skills.length ? `<div>
                                <h3 class="font-bold border-b border-blue-400 text-[11px] tracking-wider mb-1.5">SKILLS</h3>
                                <ul class="text-[10px] space-y-1 opacity-90">${activeProfile.skills.map(s => `<li>• ${s}</li>`).join('')}</ul>
                            </div>` : ''}
                            ${activeProfile.education ? `<div>
                                <h3 class="font-bold border-b border-blue-400 text-[11px] tracking-wider mb-1.5">EDUCATION</h3>
                                <p class="text-[10px] opacity-90 whitespace-pre-line">${activeProfile.education}</p>
                            </div>` : ''}
                            ${activeProfile.certifications.length ? `<div>
                                <h3 class="font-bold border-b border-blue-400 text-[11px] tracking-wider mb-1.5">CERTIFICATIONS</h3>
                                <ul class="text-[10px] space-y-1 opacity-90">${activeProfile.certifications.map(c => `<li>• ${c}</li>`).join('')}</ul>

                        </button>

                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHTML);
        }

        function closeModal() {
            const modal = document.getElementById('payment-modal');

        async function processPayment() {
            const btn = document.getElementById('pay-btn');
            const promoCode = document.getElementById('promo-code-input').value;
            
            btn.innerText = "Processing...";
            btn.disabled = true;

            try {
                const response = await fetch('/api/create-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        promoCode: promoCode,
                        email: currentUserEmail 
                    })
                });
                
                const orderData = await response.json();
                
                const options = {
                    "key": "YOUR_RAZORPAY_KEY", // Make sure to replace this
                    "amount": orderData.amount,
                    "currency": "INR",
                    "name": "GetPerfectResume.com",
                    "order_id": orderData.id,
                    "handler": function (response){
                        alert("Payment successful! Document download initiated.");
                        closeModal();
                    },
                    "theme": { "color": "#0F3B68" }
                };
                const rzp1 = new Razorpay(options);
                rzp1.open();

            } catch (error) {
                alert("Payment initialization failed. Please try again.");
                btn.innerText = "Pay ₹199 & Download";
                btn.disabled = false;
            }
        }
